# Run3 graphics/performance defaults. Command-line values have first priority.
scene-quality=high
texture-quality=high
model-quality=high
render.lighting_pipeline=legacy-forward
render.shadow_quality=low
render.shadow_update_interval=2
# Directional PSSM split ends in Run3 centimetres: 60 m, 1000 m, 5000 m.
render.shadow_cascade_1_distance=6000
render.shadow_cascade_2_distance=100000
render.shadow_cascade_3_distance=500000
render.exposure=1.0
resolution=1280x720
fullscreen=false
render-hz=0
fov=75
ui-scale=1.0
